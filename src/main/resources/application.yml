spring:
  application:
    name: graphql-shop
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=graphql_shop;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  graphql:
    graphiql:
      enabled: ${GRAPHQL_GRAPHIQL_ENABLED:true}
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  port: ${SERVER_PORT:8080}
